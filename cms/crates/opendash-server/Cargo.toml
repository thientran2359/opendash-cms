[package]
name = "opendash-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "opendash"
path = "src/main.rs"

[dependencies]
opendash-core = { path = "../opendash-core" }
argon2 = { workspace = true }
axum = { workspace = true }
http-body = { workspace = true }
image = { workspace = true }
lettre = { workspace = true }
minijinja = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
wasmi = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
wat = { workspace = true }
rustls = { version = "=0.23.46", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false }
rustls-pemfile = "=2.2.0"
rustls-pki-types = "=1.15.1"
