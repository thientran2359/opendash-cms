<div class="od-block-banner relative flex items-center justify-center overflow-hidden rounded-2xl bg-od-surface shadow-sm" style="position:relative;min-height:var(--od-banner-h,360px);background-image:var(--od-banner-bg,none);background-size:cover;background-position:var(--od-banner-fx,50%) var(--od-banner-fy,50%);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;">
  <div class="od-banner-overlay" style="position:absolute;inset:0;background-color:var(--od-banner-overlay,transparent);pointer-events:none;"></div>
  <div class="od-banner-inner w-full px-6 py-12 md:px-10 md:py-16" style="position:relative;z-index:1;width:100%;padding:32px;text-align:var(--od-banner-align,center);">
    <h2 class="od-banner-heading font-od-heading text-3xl font-bold tracking-tight md:text-5xl">{{ heading }}</h2>
    {% if body %}<div class="od-banner-body od-prose mt-4 text-lg leading-relaxed">{{ body }}</div>{% endif %}
    {% if show_cta and cta_label and cta_url %}<div class="od-banner-actions mt-8"><a class="od-banner-cta inline-flex items-center rounded-lg bg-od-primary px-6 py-3 font-semibold text-white shadow-sm transition-colors hover:bg-blue-700" href="{{ cta_url }}" rel="noopener noreferrer">{{ cta_label }}</a></div>{% endif %}
  </div>
</div>
