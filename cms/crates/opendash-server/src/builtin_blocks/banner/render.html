<div class="od-block-banner" style="position:relative;min-height:var(--od-banner-h,360px);background-image:var(--od-banner-bg,none);background-size:cover;background-position:var(--od-banner-fx,50%) var(--od-banner-fy,50%);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;">
  <div class="od-banner-overlay" style="position:absolute;inset:0;background-color:var(--od-banner-overlay,transparent);pointer-events:none;"></div>
  <div class="od-banner-inner" style="position:relative;z-index:1;width:100%;padding:32px;text-align:var(--od-banner-align,center);">
    <h2 class="od-banner-heading">{{ heading }}</h2>
    {% if body %}<div class="od-banner-body">{{ body }}</div>{% endif %}
    {% if show_cta and cta_label and cta_url %}<div class="od-banner-actions"><a class="od-banner-cta" href="{{ cta_url }}" rel="noopener noreferrer">{{ cta_label }}</a></div>{% endif %}
  </div>
</div>
