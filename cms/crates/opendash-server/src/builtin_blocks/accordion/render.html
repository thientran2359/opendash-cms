<div class="od-block-accordion od-accordion-{{ style }}">
  {% for item in items %}
  <details class="od-accordion-item"{% if item.open or (open_first and loop.first) %} open{% endif %}>
    <summary class="od-accordion-title">{{ item.title }}</summary>
    {% if item.content %}<div class="od-accordion-content">{{ item.content }}</div>{% endif %}
  </details>
  {% endfor %}
</div>
