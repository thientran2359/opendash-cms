<footer class="mt-12 border-t border-od-border bg-od-surface-alt"><div class="mx-auto grid max-w-7xl gap-8 px-4 py-12 md:grid-cols-2 md:px-8"><div><strong class="font-od-heading text-xl text-od-text">{{ site.title }}</strong>{% if site.tagline %}<p class="mt-3 text-sm text-od-muted">{{ site.tagline }}</p>{% endif %}<p class="mt-6 text-sm text-od-muted">{{ options.footer_copyright }}</p></div><nav aria-label="{{ __("Footer links", "opendash-starter") }}"><strong class="font-semibold text-od-text">{{ __("Links", "opendash-starter") }}</strong><ul class="mt-4 space-y-3">{% if menus.footer is defined %}{% for item in menus.footer.items %}<li><a class="text-od-muted hover:text-od-primary" href="{{ item.url }}">{{ item.label }}</a></li>{% endfor %}{% endif %}</ul></nav></div></footer>
