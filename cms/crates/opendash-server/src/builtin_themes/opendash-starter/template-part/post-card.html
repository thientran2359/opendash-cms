<article class="rounded-2xl border border-od-border bg-od-surface p-6 shadow-sm">{% if entry.cover_url %}<img class="mb-4 h-48 w-full rounded-lg object-cover" src="{{ entry.cover_url }}" alt="{{ entry.title }}" loading="lazy">{% endif %}<h2 class="font-od-heading text-xl font-semibold"><a href="{{ entry.url }}" class="text-od-primary hover:underline">{{ entry.title }}</a></h2></article>
