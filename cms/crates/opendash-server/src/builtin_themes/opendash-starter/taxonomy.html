<main class="mx-auto max-w-7xl px-4 py-10 md:px-8 md:py-16"><span class="text-sm uppercase tracking-wide text-od-primary">{{ t.topic_label }}</span><h1 class="mb-8 font-od-heading text-4xl font-bold">{{ taxonomy.name }}</h1><div class="grid grid-cols-1 gap-6 md:grid-cols-3">{% for entry in entries %}<article class="rounded-xl border border-od-border bg-od-surface p-6"><h2 class="font-od-heading text-xl font-semibold"><a class="text-od-primary hover:underline" href="{{ entry.url }}">{{ entry.title }}</a></h2></article>{% else %}<p>{{ t.empty_content }}</p>{% endfor %}</div><nav class="mt-10 flex gap-6">{% if previous_url %}<a href="{{ previous_url }}">{{ t.previous_page }}</a>{% endif %}{% if next_url %}<a href="{{ next_url }}">{{ t.next_page }}</a>{% endif %}</nav></main>
