<main class="mx-auto max-w-7xl px-4 py-12 md:px-8"><h1 class="mb-8 font-od-heading text-4xl font-bold">{{ site.title }}</h1><p class="mb-8 text-od-muted">{{ site.tagline }}</p><div class="grid grid-cols-1 gap-6 md:grid-cols-3">{% for entry in entries %}<article class="rounded-xl border border-od-border bg-od-surface p-6"><h2 class="font-od-heading text-xl font-semibold"><a href="{{ entry.url }}" class="text-od-primary">{{ entry.title }}</a></h2></article>{% else %}<p>{{ __("No content yet.", "opendash-starter") }}</p>{% endfor %}</div><nav class="mt-10 flex justify-between gap-4" aria-label="{{ __("Pagination", "opendash-starter") }}">{% if previous_url %}<a class="text-od-primary" href="{{ previous_url }}">{{ __("← Previous", "opendash-starter") }}</a>{% endif %}{% if next_url %}<a class="text-od-primary" href="{{ next_url }}">{{ __("Next →", "opendash-starter") }}</a>{% endif %}</nav></main>
