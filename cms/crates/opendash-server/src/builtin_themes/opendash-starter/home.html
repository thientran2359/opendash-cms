<main class="w-full"><div class="mx-auto max-w-7xl px-4 py-8 md:px-8 md:py-16"><div class="mb-8 rounded-3xl bg-od-surface-alt px-6 py-12 md:px-10 md:py-16"><span class="text-sm font-semibold uppercase tracking-wide text-od-primary">{{ options.header_badge }}</span><h1 class="mt-4 font-od-heading text-4xl font-extrabold tracking-tight text-od-text md:text-5xl">{{ site.title }}</h1>{% if site.tagline %}<p class="mt-4 text-lg leading-relaxed text-od-muted">{{ site.tagline }}</p>{% endif %}<a class="mt-8 inline-flex rounded-lg bg-od-primary px-6 py-3 font-semibold text-white hover:bg-blue-700" href="{{ options.header_cta_url }}">{{ options.header_cta_label }}</a></div><div class="od-prose">{{ od_content() }}</div></div></main>
