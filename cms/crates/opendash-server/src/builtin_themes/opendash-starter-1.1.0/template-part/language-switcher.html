{% if locale.alternates|length > 1 %}<details class="relative"><summary class="cursor-pointer list-none rounded-lg border border-od-border bg-od-surface px-3 py-2 text-sm font-medium text-od-text hover:border-od-primary" aria-label="{{ t.language_switcher_label }}">{{ locale.label }}</summary><ul class="absolute right-0 z-20 mt-2 min-w-40 rounded-lg border border-od-border bg-od-surface p-1 shadow-md">{% for item in locale.alternates %}<li><a class="block rounded-md px-3 py-2 text-sm {% if item.is_current %}font-semibold text-od-primary{% else %}text-od-text hover:bg-od-surface-alt{% endif %}" href="{{ item.url }}" lang="{{ item.bcp47_tag }}">{{ item.label }}</a></li>{% endfor %}</ul></details>{% endif %}
