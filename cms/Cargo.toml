[workspace]
resolver = "3"
members = [
    "crates/opendash-core",
    "crates/opendash-server",
]

[workspace.dependencies]
argon2 = { version = "=0.5.3", features = ["std"] }
axum = "=0.8.9"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
minijinja = { version = "=3.0.5", features = ["fuel"] }
mime_guess = "=2.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
url = "=2.5.8"
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
rust-embed = { version = "=8.6.0", features = ["mime-guess"] }
wasmi = "=2.0.0"
wat = "=1.263.0"
zip = { version = "=9.3.0", default-features = false, features = ["deflate"] }
