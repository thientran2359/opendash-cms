name: OpenDash Governance

# Do not restrict paths: a required check must exist on every PR, including
# code-only changes and changes to governance itself.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: governance-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: GitHub Issue handoff tests
        run: python -m unittest discover -s .agents/scripts -p test_prepare_github_issue.py -v

      - name: Planning documentation consistency
        run: python cms/scripts/check-plans.py

      - name: Planning checker self-test
        run: python cms/scripts/check-plans.py --self-test

      - name: Agent artifacts and obvious secret guard
        run: python .agents/scripts/check-agent-artifacts.py

      - name: Whitespace errors in proposed changes
        run: git diff --check HEAD^ HEAD
