name: "Research / EGM Design Draft"
description: "Theo dõi bài toán khám phá (/egm-brainstorm) hoặc soạn đặc tả (/egm-draft) trước khi đạt Status: Approved."
title: "[EGM Design] "
body:
  - type: markdown
    attributes:
      value: |
        Chỉ dùng để theo dõi nghiên cứu hoặc soạn thảo Design Spec trong `docs/designs/`.
        Không cấp Task ID triển khai `EGM-<slug>-Sxx` và không giao coding agent triển khai khi spec chưa đạt `Status: Approved` và chưa merge vào `main`.
  - type: input
    id: target_spec
    attributes:
      label: Đường dẫn Design Spec dự kiến
      placeholder: "docs/designs/<feature>.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Bài toán & Bối cảnh
      placeholder: "Hiện trạng trong cms/, vấn đề cần giải quyết và ràng buộc sản phẩm..."
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Kết quả cần bàn giao
      placeholder: "concepts_brief.md, Design Spec đầy đủ FeatureRange + Detailed Implementation Plan, Goldfish review & /egm-resolve..."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Tài liệu nền tảng & GoldfishContext liên quan
      placeholder: "PRODUCT_REQUIREMENTS.md, CORE_FOUNDATION.md, SITEMAP.md, file mã nguồn cms/..."
    validations:
      required: true
