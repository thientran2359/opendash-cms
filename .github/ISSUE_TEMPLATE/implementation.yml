name: "Implementation task (EGM Approved)"
description: "Task triển khai từ Design Spec EGM đã duyệt (Status: Approved); dành cho coordinator và coding agent (Forge / Harbor / Nova)."
title: "[EGM-<slug>-S01] "
body:
  - type: markdown
    attributes:
      value: |
        Issue phải đọc hiểu độc lập. Đặc tả thiết kế EGM (`docs/designs/<feature>.md`, `Status: Approved`) trên `origin/main` là nguồn kỹ thuật chuẩn;
        mọi thay đổi yêu cầu/schema phải cập nhật vào Design Spec trước rồi đồng bộ Issue.
        Ưu tiên sinh tự động bằng `.agents/scripts/prepare-github-issue.py --source docs/designs/<feature>.md [--slice S01] --agent <agent>`.
  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: "ID theo chuẩn EGM, ví dụ EGM-theme-format-and-template-resolver-S01."
      placeholder: "EGM-theme-format-and-template-resolver-S01"
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: Tổng quan & Mục tiêu (Overview / Goals)
      description: "Tóm tắt mục tiêu và giá trị mang lại từ Design Spec."
      placeholder: "Hiện trạng, vấn đề, mục tiêu của slice này..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "None hoặc Slice/Issue bắt buộc hoàn tất trước (ví dụ: S01 / Issue #425)."
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: File Ownership & Phạm vi triển khai
      description: "Danh sách file trong `cms/` và `docs/` được phép tạo/sửa thuộc slice này."
      placeholder: "- cms/crates/opendash-core/src/...\n- cms/crates/opendash-server/src/..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria (riêng slice này)
      description: "Các tiêu chí kiểm chứng riêng của slice; không tự đánh dấu hoàn thành khi mới tạo Issue."
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: verification_rollback
    attributes:
      label: Verification Commands & Rollback
      placeholder: "Lệnh kiểm chứng bắt buộc (check-standards, check-plans, cargo fmt/test) và cách rollback an toàn..."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Nguồn Design Spec EGM đã duyệt
      description: "Repo-relative path, link blob tại source SHA đã duyệt và baseline code SHA."
      placeholder: "docs/designs/<feature>.md\nSource SHA: <40-hex>\nBase SHA: <40-hex>"
    validations:
      required: true
  - type: checkboxes
    id: gate_confirmation
    attributes:
      label: Kiểm tra cổng EGM trước khi chuyển Ready
      options:
        - label: "Design Spec tại source SHA có Status: Approved, Approved By, Approval Evidence và Goldfish Review receipt đầy đủ."
          required: true
        - label: "Nội dung Issue khớp với Detailed Implementation Plan & Slice Contract trên origin/main."
          required: true
